# Real-data overrides on top of configs/pinn.yaml (M6/M7). Run: python scripts/run_real.py ...
h_net:
  terrain_sigma_km: 10        # network models head minus elevation smoothed at 10 km (Gaussian sigma): between wells the
                              # water table follows the land. Validation Task B, 3 layouts, GP stand-in for the surface:
                              # 9.56 m -> 8.47 m (sigma 5: 8.46; 20: 9.65). The PDE still acts on the full head.
training:
  fix_T: true                 # T from the CGWB reports (configs/priors.yaml); M2 diagnostics: S and pumping stay
                              # accurate with T 30% wrong, while sparse data cannot pin T down
  S_range: [0.072, 0.15]      # CGWB report range (priors.yaml belt.S_range). Batch 1 without it: S fell to 0.0002-0.02,
                              # the time physics switched off and 2019 forecasts blew up (zones 1, 3: 10-19 m)
  well_offsets: {weight: 100.0, sigma_m: 3.0, sigma_noise_m: 1.0}   # per-well corrections for elevation error; weight 100 x the
                              # Gaussian prior: laptop check gave a 2.6 m spread (weight 1: 15.8 m, flattened surface)
  weighting: {type: fixed, init: 10.0, alpha: 0.1, every: 100}   # data weight; M2 noise runs: 100 chases noise
  n_colloc: 8192              # larger domain and 20 years (synthetic: 60 x 60 km, 10 years)
  lbfgs_colloc: 16384
  stages: {data_only: 3000, physics_frozen: 5000, joint: 40000, lbfgs: 1000}
q_net:
  doy_at_t0: 0                # t = 0 is 1 January 2005
