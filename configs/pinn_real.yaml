# Real-data overrides on top of configs/pinn.yaml (M6/M7). Run: python scripts/run_real.py ...
h_net:
  terrain_sigma_km: 10        # network models head minus elevation smoothed at 10 km (Gaussian sigma): between wells the
                              # water table follows the land. Validation Task B, 3 layouts, GP stand-in for the surface:
                              # 9.56 m -> 8.47 m (sigma 5: 8.46; 20: 9.65). The PDE still acts on the full head.
training:
  fix_T: true                 # T from the CGWB reports (configs/priors.yaml); M2 diagnostics: S and pumping stay
                              # accurate with T 30% wrong, while sparse data cannot pin T down
  S_range: [0.072, 0.15]      # CGWB report range (priors.yaml belt.S_range). Batch 1 without it: S fell to 0.0002-0.02,
                              # the time physics switched off and 2019 forecasts blew up (zones 1, 3: 10-19 m)
  well_offsets: {weight: 1.0, sigma_m: 3.0, sigma_noise_m: 1.0}   # per-well corrections for elevation error (x the Gaussian
                              # prior). Batch 2 (tag tb_off1), chosen by the pre-set rule on validation: weight 1 scores 2.27
                              # against 2.82 for weight 100 (val A 2.03 m, B 9.51 m); offsets spread 7.0 m. Without terrain
                              # (batch 1) weight 1 flattened the surface (B 12.2 m), so it is tied to terrain_sigma_km.
  weighting: {type: fixed, init: 10.0, alpha: 0.1, every: 100}   # data weight; M2 noise runs: 100 chases noise
  n_colloc: 8192              # larger domain and 20 years (synthetic: 60 x 60 km, 10 years)
  lbfgs_colloc: 16384
  stages: {data_only: 3000, physics_frozen: 5000, joint: 40000, lbfgs: 1000}
canal_seepage:                # extra recharge along canals (CLAUDE.md §6.4 item 6).
                              # Validation wells within 2 km of a canal sit 6.1 m above the regional PINN (far: 0.6 m);
                              # training wells' corrections: +1.7 m near, -0.95 m far. GEC-2015 Table 9: unlined canals in
                              # normal soils 17.5 ham/day per million m² of wetted area = 0.175 m/day.
  strength: 1                 # 1 = the norm with the assumptions below; area mean ~0.025 m/yr (rain recharge ~0.14).
                              # Batch 3 (tag tbc), pre-set rule on validation: score 2.22 vs 2.27 without -> kept.
                              # Half / double (tbc05, tbc2) are sensitivity only, not chosen from.
  seepage_m_per_day: 0.175
  wetted_m: 10                # assumed wetted perimeter of the mapped channels
  days_per_yr: 180            # assumed canal running days (rotational supply)
  sigma_km: 2
q_net:
  doy_at_t0: 0                # t = 0 is 1 January 2005
